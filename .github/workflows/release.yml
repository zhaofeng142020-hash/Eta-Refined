# =============================================================================
# 自动发布到 GitHub Releases（Eta-Refined）
# -----------------------------------------------------------------------------
# 触发：
#   * push tag `v*`     → 正式版（tag 名即版本，校验与 output-metadata.json 的
#                         versionName 一致，使用 --verify-tag）
#   * push main 分支    → 预发布 nightly：滚动更新固定 tag `nightly`（--prerelease），
#                         且仅当代码/构建相关路径变更时触发（见下方 paths 过滤）
#   * workflow_dispatch → 同 main 逻辑（nightly）；可选输入 version 覆盖标题/资产里的版本名
#
# 流程：
#   checkout → 复用 ./.github/actions/setup-build 安装环境 →
#   无条件跑 lint + 单元测试（--continue，保证 main 首次推送在未配置 Secrets 时
#   也至少静态检查/测试通过、不红）→
#   还原签名证书（缺 Secrets 时优雅降级：ready=false，跳过发布，任务仍成功）→
#   仅当证书就绪时才 assembleRelease → apksigner 校验 → 整理 APK →
#   gh release create 上传 Release APK 资产。
#
# 优雅降级：全新仓库首次 push main 若尚未配置签名 Secrets，工作流不会失败；
#   一旦配置了 ETA_REFINED_*（或兼容 ETA_RELEASE_*）Secrets，tag / main / 手动
#   三条触发即自动发布。
#
# 签名 Secrets：改用 ETA_REFINED_ 新前缀，同时兼容旧的 ETA_RELEASE_ 名称
#   （下方用 `||` 回退：新名优先，旧名兜底）。
#   ETA_REFINED_KEYSTORE_BASE64 / ETA_REFINED_STORE_PASSWORD
#   ETA_REFINED_KEY_ALIAS      / ETA_REFINED_KEY_PASSWORD
#   注意：Gradle（app/build.gradle.kts）读取的是 ETA_RELEASE_* 环境变量名，
#   因此这里把 Secret 映射到旧的 env 变量名后再交给 Gradle。
#
# 权限：contents: write（创建 Release / tag）。失败不发布、不改动源码。
# 依赖：gh CLI 在 GitHub Actions 中已预装，GH_TOKEN 使用 secrets.GITHUB_TOKEN。
# =============================================================================

name: Release

on:
  push:
    # GitHub 语义说明：push 同时带 `tags` 与 `branches` 时二者是「或」关系；
    # `paths` 只与 `branches` 联用（分支推送需同时满足 branches 与 paths）。
    # 关键：路径过滤不作用于 tag 推送 —— 官方文档明确写明
    #   "Path filters are not evaluated for pushes of tags."
    # 因此本 paths 只收窄 main 分支的 nightly 触发；`v*` tag 推送不受影响、
    # 仍照常发布正式版。文档、以及工作流自身（.github/workflows/**）的改动
    # 不再触发 nightly；只有代码/构建相关路径变更才会。
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/actions/setup-build/**"
  workflow_dispatch:
    inputs:
      version:
        description: "可选：覆盖 nightly 标题/资产中的版本名（例如 3.4.0，可省略前导 v）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 固定 group：所有发布运行（tag 正式版 / main nightly / 手动 nightly）串行执行，
  # 保证 nightly 的「删除旧 tag → 重建」序列不会被另一个发布运行并发打断，
  # 同一时刻只会存在一个 nightly Release（并发处理）。
  group: release
  # 发布过程不中途取消，避免出现半上传的 Release
  cancel-in-progress: false

jobs:
  release:
    name: 测试 / 构建 / 发布
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        # 发布前静态检查守门：与 pr-check.yml 一致，同时跑 lintDebug + testDebugUnitTest；
        # --continue 让两项都跑完再判定，lint 失败也不会掩盖测试结果。
        # 无条件运行：即使尚未配置签名 Secrets，main / tag / 手动触发也至少保证
        # 静态检查 / 测试通过、任务不红。
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 还原发布证书
        id: sign
        env:
          ETA_REFINED_KEYSTORE_BASE64: ${{ secrets.ETA_REFINED_KEYSTORE_BASE64 || secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_REFINED_STORE_PASSWORD: ${{ secrets.ETA_REFINED_STORE_PASSWORD || secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_REFINED_KEY_ALIAS: ${{ secrets.ETA_REFINED_KEY_ALIAS || secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_REFINED_KEY_PASSWORD: ${{ secrets.ETA_REFINED_KEY_PASSWORD || secrets.ETA_RELEASE_KEY_PASSWORD }}
        # 优雅降级：缺 Secrets 时不失败，输出 ready=false 并跳过后续发布步骤
        run: |
          if [[ -z "$ETA_REFINED_KEYSTORE_BASE64" ||
                -z "$ETA_REFINED_STORE_PASSWORD" ||
                -z "$ETA_REFINED_KEY_ALIAS" ||
                -z "$ETA_REFINED_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名 Secrets，跳过发布（lint 与单元测试已完成，任务保持成功）。"
            exit 0
          fi
          printf '%s' "$ETA_REFINED_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-refined-release.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Release 构建
        if: steps.sign.outputs.ready == 'true'
        env:
          # Gradle 读取的是 ETA_RELEASE_* env 变量；Secret 名走 ETA_REFINED_ 新前缀并兼容旧名
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-refined-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_REFINED_STORE_PASSWORD || secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_REFINED_KEY_ALIAS || secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_REFINED_KEY_PASSWORD || secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleRelease

      - name: 校验并整理 APK
        id: apk
        if: steps.sign.outputs.ready == 'true'
        env:
          # workflow_dispatch 时才有的输入，push 事件下为空字符串
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}），期望 1 个。"
            exit 1
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          # 签名校验：确保产物确实被发布证书签名
          "$apksigner_path" verify "${release_apks[0]}"

          version_name="$(jq -r '.elements[0].versionName' \
            app/build/outputs/apk/release/output-metadata.json)"
          short_sha="${GITHUB_SHA::7}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # 正式版：标签必须等于 v<versionName>，避免标签与安装包版本错位
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            title="$tag"
            prerelease="false"
            asset="Eta-${tag}.apk"
          else
            # nightly / 手动触发：滚动更新单个固定 tag `nightly`，不再按 sha 堆积 tag。
            # 标签固定；版本与短 sha 体现在 Release 标题与 APK 文件名中，便于追溯。
            base_version="$version_name"
            manual_version="${MANUAL_VERSION#v}"
            if [[ -n "$manual_version" ]]; then
              base_version="$manual_version"
            fi
            tag="nightly"
            title="Nightly v${base_version} (${short_sha})"
            prerelease="true"
            asset="Eta-v${base_version}-nightly.${short_sha}.apk"
          fi

          mkdir -p dist
          cp "${release_apks[0]}" "dist/${asset}"

          {
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "prerelease=$prerelease"
            echo "title=$title"
            echo "apk_path=dist/${asset}"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        if: steps.sign.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
          TITLE: ${{ steps.apk.outputs.title }}
          PRERELEASE: ${{ steps.apk.outputs.prerelease }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            # 滚动 nightly：始终只保留一个 nightly Release / tag。
            # 1) 先删除旧的 nightly Release 及其 tag（--cleanup-tag）再重建；
            #    `|| true` 兼容首次运行（nightly 尚不存在，删除会报错）。
            # 2) 并发：工作流级 concurrency（固定 group: release、cancel-in-progress:false）
            #    把所有发布运行串行化，保证「删除 → 重建」序列不被其它发布运行打断。
            # 3) --target 固定为当前提交 sha，使 nightly tag 指向本次构建。
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --prerelease \
              --generate-notes \
              --target "$GITHUB_SHA"
          else
            # 正式版：tag 已存在，强制校验（--verify-tag），逻辑保持不变
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --verify-tag
          fi
